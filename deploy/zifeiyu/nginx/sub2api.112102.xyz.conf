# Sub2API zifeiyu deployment
map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sub2api.112102.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub2api.112102.xyz;

    ssl_certificate /root/zifeiyu/tools/ssl/112102.xyz.pem;
    ssl_certificate_key /root/zifeiyu/tools/ssl/112102.xyz.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    client_max_body_size 256M;

    # LinuxDO Connect / New-API legacy callback compatibility.
    # Redirect first so the browser re-sends path-scoped OAuth state cookies
    # to the canonical backend callback.
    location = /oauth/linuxdo {
        return 302 /api/v1/auth/oauth/linuxdo/callback$is_args$args;
    }

    location = /api/oauth/linuxdo {
        return 302 /api/v1/auth/oauth/linuxdo/callback$is_args$args;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}
