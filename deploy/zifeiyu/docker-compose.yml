services:
  sub2api:
    build:
      context: ${SUB2API_BUILD_CONTEXT:-../..}
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        VERSION: ${SUB2API_VERSION:-0.1.183-zifeiyu}
        COMMIT: ${SUB2API_COMMIT:-local}
    image: sub2api-zifeiyu:${SUB2API_IMAGE_TAG:-local}
    container_name: sub2api-zifeiyu
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "127.0.0.1:${SUB2API_ORIGIN_PORT:-18080}:8080"
    volumes:
      - ./fresh/data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - SERVER_TRUSTED_PROXIES=172.29.50.1/32
      - RUN_MODE=standard
      - DATABASE_HOST=sub2api-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=sub2api-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=0
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      - SECURITY_URL_POLICY_PROFILE=${SECURITY_URL_POLICY_PROFILE:-compatible}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
    networks:
      - sub2api-network
      - sub2api-egress-v6
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  sub2api-postgres:
    image: postgres:18-alpine
    container_name: sub2api-zifeiyu-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./fresh/postgres_data:/var/lib/postgresql/data
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  sub2api-redis:
    image: redis:8-alpine
    container_name: sub2api-zifeiyu-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - TZ=${TZ:-Asia/Shanghai}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ./fresh/redis_data:/data
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  sub2api-network:
    name: sub2api-zifeiyu-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.50.0/24
          gateway: 172.29.50.1

  # Application-only dual-stack egress. PostgreSQL and Redis are deliberately
  # not attached, preserving database isolation while allowing IPv6-only proxy hosts.
  sub2api-egress-v6:
    name: sub2api-zifeiyu-egress-v6
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.51.0/24
          gateway: 172.29.51.1
        - subnet: fd00:29:51::/64
          gateway: fd00:29:51::1
