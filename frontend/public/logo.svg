<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Tech Slate -->
    <linearGradient id="s2a-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ambient Blue & Indigo Radial Glow -->
    <radialGradient id="s2a-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Stream Top (Sky to Cobalt Blue) -->
    <linearGradient id="s2a-stream-top" x1="120" y1="120" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Stream Bottom (Electric Blue to Cyan) -->
    <linearGradient id="s2a-stream-bottom" x1="380" y1="380" x2="120" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Lightning Spark Gradient -->
    <linearGradient id="s2a-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Soft 3D Glow Filter -->
    <filter id="s2a-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2563eb" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container App Icon Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#s2a-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#s2a-glow)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Interlocking S-API Gateway Streams with Dynamic Shadows -->
  <g filter="url(#s2a-shadow)">
    <!-- Top Arc (Subscription to Router) -->
    <path
      d="M 374 156 C 374 156, 314 122, 236 122 C 154 122, 130 178, 130 220 C 130 270, 186 288, 264 304 C 342 320, 386 352, 386 400"
      fill="none"
      stroke="url(#s2a-stream-top)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bottom Arc (Flow into High-Speed API) -->
    <path
      d="M 138 356 C 138 356, 198 390, 276 390 C 358 390, 382 334, 382 292 C 382 242, 326 224, 248 208 C 170 192, 126 160, 126 112"
      fill="none"
      stroke="url(#s2a-stream-bottom)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Core Lightning Node (High Throughput Pulse) -->
    <circle cx="256" cy="256" r="26" fill="url(#s2a-spark)" />
    <path d="M 250 236 L 268 252 L 254 256 L 264 276 L 246 260 L 260 256 Z" fill="#0f172a" />
  </g>
</svg>