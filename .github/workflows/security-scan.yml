name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "9.15.9"
      - name: Install dependencies with frozen lockfile
        run: make verify-frontend-lockfile
      - name: Generate production dependency audit
        working-directory: frontend
        run: |
          pnpm audit --prod --json --registry=https://registry.npmjs.org \
            > audit.production.json || true
      - name: Generate full dependency audit
        working-directory: frontend
        run: |
          pnpm audit --json --registry=https://registry.npmjs.org \
            > audit.full.json || true
      - name: Enforce high and critical audit policy
        run: |
          python3 tools/check_pnpm_audit_exceptions.py \
            --production-audit frontend/audit.production.json \
            --full-audit frontend/audit.full.json \
            --exceptions .github/audit-exceptions.yml
